name: Deploy Workers Builds MCP (self-host)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/workers-builds-free-cloudflare
    paths:
      - 'apps/workers-builds/**'
      - 'packages/mcp-common/**'
      - 'packages/mcp-observability/**'
      - '.github/workflows/deploy-workers-builds-selfhost.yml'

concurrency:
  group: workers-builds-selfhost
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Dependency consistency
        run: pnpm check:deps

      - name: Type and lint checks
        run: pnpm check:turbo

      - name: Tests
        run: pnpm test

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN secret' && exit 1)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: pnpm -C apps/workers-builds exec wrangler deploy --config wrangler.selfhost.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
