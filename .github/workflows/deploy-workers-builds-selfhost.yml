name: Deploy Workers Builds MCP (self-host)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/workers-builds-free-cloudflare
    paths:
      - 'apps/workers-builds/**'
      - 'packages/mcp-common/**'
      - 'packages/mcp-observability/**'
      - '.github/workflows/deploy-workers-builds-selfhost.yml'

concurrency:
  group: workers-builds-selfhost
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Dependency consistency
        run: pnpm check:deps

      - name: Type and lint checks
        run: pnpm check:turbo

      - name: Tests
        run: pnpm test

      - name: Validate Cloudflare credentials
        id: cloudflare-credentials
        shell: bash
        run: |
          if test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Skipping deploy because CLOUDFLARE_ACCOUNT_ID and/or CLOUDFLARE_API_TOKEN is not configured."
          echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare-credentials.outputs.deploy_enabled == 'true'
        run: pnpm -C apps/workers-builds exec wrangler deploy --config wrangler.selfhost.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
