name: Deploy Workers Builds MCP (self-host)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/workers-builds-free-cloudflare
    paths:
      - 'apps/workers-builds/**'
      - 'packages/mcp-common/**'
      - 'packages/mcp-observability/**'
      - '.github/workflows/deploy-workers-builds-selfhost.yml'

concurrency:
  group: workers-builds-selfhost
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Dependency consistency
        run: pnpm check:deps

      - name: Type and lint checks
        run: pnpm check:turbo

      - name: Tests
        run: pnpm test

      - name: Skip deploy when Cloudflare credentials are unavailable
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Skipping self-host deployment because Cloudflare credentials are not configured."

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm -C apps/workers-builds exec wrangler deploy --config wrangler.selfhost.jsonc
