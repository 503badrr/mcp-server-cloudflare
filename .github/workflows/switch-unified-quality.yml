name: Switch Unified MCP Quality

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']
  push:
    branches: ['main', 'release/switch-unified-2026-08-01']

env:
  FORCE_COLOR: 1

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify Switch Cloudflare deployment guard
        run: >-
          node .github/scripts/validate-switch-cloudflare-config.mjs
          apps/workers-observability/wrangler.jsonc
      - uses: ./.github/actions/setup
      - name: Validate dependency policy
        run: pnpm check:deps
      - name: Run workspace type and lint checks
        run: pnpm check:turbo
      - name: Check formatting
        run: pnpm check:format
      - name: Run monorepo tests
        run: pnpm test:ci
      - name: Verify the observability library types
        run: pnpm --filter @repo/mcp-observability types
      - name: Verify the selected Workers Observability app
        run: pnpm --filter workers-observability check:types
